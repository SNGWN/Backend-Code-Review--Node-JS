name: Release

# Build the self-contained, offline bundle and attach the ZIP to a GitHub Release.
# Triggers on a version tag (e.g. v1.0.0) or manual dispatch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc) and test
        run: |
          npm run build
          npm test -- --runInBand

      - name: Bundle + package release ZIP
        run: npm run package:release

      - name: Smoke-test the bundle with NO node_modules
        run: |
          tmp="$(mktemp -d)"
          cp release/code-review.js "$tmp/"
          ( cd "$tmp" && node code-review.js --list-rules > /dev/null && node code-review.js --version )

      - name: Upload ZIP as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-code-review-bundle
          path: release/*.zip

      - name: Attach ZIP to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
